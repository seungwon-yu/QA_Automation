name: Game QA portfolio verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests
        id: unit
        run: npm test -- --reporter=default --reporter=json --outputFile=artifacts/results/unit.json
      - name: Browser E2E
        id: e2e
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        run: npm run test:e2e
      - name: Summarize all available results
        if: always()
        env:
          QA_UNIT_OUTCOME: ${{ steps.unit.outcome }}
          QA_E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: node scripts/summarize-results.js
      - name: Upload evidence even on failure
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: qa-automation-evidence
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: warn
